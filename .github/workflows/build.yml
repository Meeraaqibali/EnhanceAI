name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Generate platform folders
        run: flutter create . --platforms=android --project-name enhance_ai

      - name: Set app name to EnhanceAI
        run: |
          sed -i 's/android:label="[^"]*"/android:label="EnhanceAI"/g' android/app/src/main/AndroidManifest.xml

      - name: Set NDK + SDK versions
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            python3 - << 'PY'
          import re
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'ndkVersion' not in s:
              s = re.sub(r'(android\s*\{)', r'\1\n        ndkVersion = "27.0.12077973"', s, count=1)
          s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 35', s)
          s = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 21', s)
          s = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 35', s)
          open(p, 'w').write(s)
          PY
          else
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle || true
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enhance-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
