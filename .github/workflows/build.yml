name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Generate platform folders
        run: flutter create . --platforms=android --project-name enhance_ai

      - name: Patch Android build files
        run: |
          # Fix app name
          sed -i 's/android:label="[^"]*"/android:label="EnhanceAI"/g' android/app/src/main/AndroidManifest.xml

          # Fix build.gradle.kts (Kotlin DSL)
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's|ndkVersion = .*|ndkVersion = "27.0.12077973"|' android/app/build.gradle.kts
            sed -i 's|compileSdk = .*|compileSdk = 35|' android/app/build.gradle.kts
            sed -i 's|targetSdk = .*|targetSdk = 35|' android/app/build.gradle.kts
            sed -i 's|minSdk = .*|minSdk = 21|' android/app/build.gradle.kts
            echo "--- patched build.gradle.kts ---"
            grep -E "ndkVersion|compileSdk|targetSdk|minSdk" android/app/build.gradle.kts
          fi

          # Fix build.gradle (Groovy fallback)
          if [ -f android/app/build.gradle ]; then
            sed -i 's/ndkVersion .*/ndkVersion "27.0.12077973"/' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
            echo "--- patched build.gradle ---"
            grep -E "ndkVersion|compileSdk|targetSdk|minSdk" android/app/build.gradle
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enhance-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
