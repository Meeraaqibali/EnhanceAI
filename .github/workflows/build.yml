name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Generate platform folders
        run: flutter create . --platforms=android --project-name enhance_ai

      - name: Set app name to EnhanceAI
        run: |
          sed -i 's/android:label="enhance_ai"/android:label="EnhanceAI"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="EnhanceAI"/g' android/app/src/main/AndroidManifest.xml
          grep 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Bump Android SDK
        run: |
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: List generated icons (debug)
        run: find android/app/src/main/res -name "*.png" | head -20

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enhance-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
